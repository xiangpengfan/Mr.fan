<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页-风景相册</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #f5f5f5; padding: 30px; font-family: "微软雅黑";}
        h1 {text-align: center; color: #333; margin-bottom: 40px;}
        .img-box {display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;}
        .img-item {width: 32%; min-width: 300px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px #ccc;}
        .img-item img {width: 100%; height: 380px; object-fit: cover; display: block;}
        .nav {text-align: center; margin-top: 40px;}
        .nav a {margin: 0 10px; text-decoration: none; color: #0066cc; font-size: 18px;}
        .note {text-align: center; margin-top: 20px; color: #999; font-size: 14px;}
    </style>
</head>
<body>
    <h1>🌄 自然风光图库</h1>
    <div class="img-box">
        <!-- ✅ FastAPI 方式：直接写路径 -->
        <div class="img-item">
            <img src="/static/img/view1.jpg" alt="风景1">
        </div>
        <div class="img-item">
            <img src="/static/img/view2.jpg" alt="风景2">
        </div>
        <div class="img-item">
            <img src="/static/img/view3.jpg" alt="风景3">
        </div>
    </div>
    <div class="nav">
        <a href="/login">🔐 前往登录</a>
        <a href="/update">📝 修改密码</a>
    </div>
    <div class="note">
        💡 提示：请将风景图片放到 static/img/ 目录下
    </div>
</body>
</html>
