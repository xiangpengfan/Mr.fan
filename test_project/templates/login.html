<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录页面</title>
    <style>
        body {background: #eef4fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0;}
        .login-card {background: white; padding: 40px 30px; border-radius: 10px; width: 360px; box-shadow: 0 2px 15px #d0dceb;}
        h2 {text-align: center; margin-bottom: 30px; color: #222;}
        .item {margin-bottom: 20px;}
        label {display: block; margin-bottom: 8px; font-weight: 500;}
        input {width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;}
        button {width: 100%; padding:13px; background:#007bff; color:white; border:none; border-radius:6px; font-size:17px; cursor:pointer;}
        button:hover {background:#0056b3;}
        .back {text-align:center; margin-top:20px;}
        .back a {color:#007bff; text-decoration:none;}
    </style>
</head>
<body>
    <div class="login-card">
        <h2>用户登录</h2>
        <form action="/users/login" method="post">
            <div class="item">
                <label>用户名</label>
                <input type="text" name="username" required>
            </div>
            <div class="item">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">登录</button>
        </form>
        <div class="back">
            <a href="/index">返回首页</a>
            &nbsp;&nbsp;
            <a href="/update">修改密码</a>
        </div>
    </div>
</body>
</html>
