<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小熊猫的官网首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "微软雅黑", sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 主卡片容器：标准登录框样式 */
        .login-card {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        /* 标题样式 */
        .login-card h1 {
            font-style: italic;
            color: #333;
            margin-bottom: 20px;
        }
        /* 欢迎文字 */
        .welcome-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        /* 登录按钮样式 */
        .login-btn {
            display: inline-block;
            padding: 12px 40px;
            background-color: #2d8cf0;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            transition: background-color 0.2s;
        }
        .login-btn:hover {
            background-color: #1b76d8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>小熊猫的官网首页</h1>
        <p class="welcome-text">欢迎来到小熊猫的官网!</p>
        <a href="/signin" class="login-btn">去登录</a>
    </div>
</body>
</html>
